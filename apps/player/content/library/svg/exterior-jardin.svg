<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 456" width="616" height="456" role="img" aria-labelledby="exterior-jardin-title exterior-jardin-desc">
  <title id="exterior-jardin-title">Jardín, por fuera</title>
  <desc id="exterior-jardin-desc">El jardín de la casa al aire libre, para el interior de una tarjeta: cielo claro, casi blanco, con dos nubes; el pasto del jardín (el de isla-pasto) de lado a lado y hasta abajo, con matitas y flores, y una mata a cada lado. Exterior de tarjeta de 616 × 456: el horizonte en y 334; un edificio se apoya en y 352, centrado en x 308; quien está de pie, en y 382; lo que llega, delante, en y 408. Colores planos, luz desde arriba a la izquierda.</desc>
