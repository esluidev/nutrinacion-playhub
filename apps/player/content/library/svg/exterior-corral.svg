<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 536" width="616" height="536" role="img" aria-labelledby="exterior-corral-title exterior-corral-desc">
  <title id="exterior-corral-title">Corral, por fuera</title>
  <desc id="exterior-corral-desc">El corral de la granja al aire libre, para el interior de una tarjeta: cielo claro, casi blanco, con dos nubes en las esquinas de arriba; la cerca de madera a lo largo del fondo; y la tierra del corral (la de isla-corral) hasta abajo y de lado a lado, con manchas, paja y unas piedras. Exterior de tarjeta de 616 × 536: el horizonte en y 334; lo que va al fondo se apoya en y 432; quien está de pie, en y 462, centrado en x 308; lo que llega, delante, en y 488; el centro queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
