<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 166" width="560" height="166" role="img" aria-labelledby="isla-acera-title isla-acera-desc">
  <title id="isla-acera-title">Isla de acera</title>
  <desc id="isla-acera-desc">La isla de la calle: el suelo de la tienda en todo el taller. Sirve suelta o dentro de una tarjeta: la forma de las islas (isla-pasto.svg, isla-corral.svg), con las esquinas redondeadas del tablero (26) y el canto de delante más oscuro, pero con la orilla de atrás recta, porque es suelo hecho. Atrás, la banqueta de losetas con una jardinera a cada lado; delante, el bordillo y la calzada con su línea. Es la calle de suelo-calle.svg con las losetas en gris claro: el crema de la franja se perdía sobre el lienzo del player. Lienzo de 560 × 166: el edificio se apoya en y 72, al fondo de la banqueta; lo que va delante, entre y 120 y y 130; el centro (x 100–460) queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: canto (delante, abajo) → banqueta → juntas → bordillo → calzada y su línea → jardineras a los lados. -->
  <defs>
    <clipPath id="acera-arriba"><path d="M28 48 H532 A26 26 0 0 1 558 74 V126 A26 26 0 0 1 532 152 H28 A26 26 0 0 1 2 126 V74 A26 26 0 0 1 28 48 Z"/></clipPath>
  </defs>
