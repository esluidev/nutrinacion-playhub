      <rect id="calzada-oclusion" x="0" y="119" width="560" height="5" fill="#7C7884"/>
      <g id="linea" fill="#F7F2EA">
        <rect x="64" y="134" width="62" height="6.5" rx="3.25"/><rect x="166" y="136" width="62" height="6.5" rx="3.25"/><rect x="268" y="137" width="62" height="6.5" rx="3.25"/>
