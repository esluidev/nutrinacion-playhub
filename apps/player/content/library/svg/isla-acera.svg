        <rect x="348" y="57" width="4" height="50"/><rect x="418" y="57" width="4" height="50"/><rect x="488" y="57" width="4" height="50"/>
      </g>
      <rect id="bordillo-arista" x="0" y="106" width="560" height="5" fill="#F5F6FA"/>
