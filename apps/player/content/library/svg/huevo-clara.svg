<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 82" width="236" height="82" role="img" aria-labelledby="huevo-clara-title huevo-clara-desc">
  <title id="huevo-clara-title">Clara de huevo cruda</title>
  <desc id="huevo-clara-desc">Clara cruda recién salida de la cáscara, vista de frente y un poco desde arriba. Es transparente: se dibuja con el azul del plato hondo de la casa aclarado, para que se vea el plato a través de ella, con su grosor en un tono más oscuro abajo, la parte espesa donde descansa la yema y tres brillos blancos. Va siempre sobre ese plato. Cruda es transparente; cocida es blanca (huevo-frito). La yema se apoya con el centro de su base en x 96, y 60. La clara se apoya en el centro de su base (x 118, y 79). Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
