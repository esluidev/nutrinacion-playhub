<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 144" width="142" height="144" role="img" aria-labelledby="huevo-cascara-base-title huevo-cascara-base-desc">
  <title id="huevo-cascara-base-title">Media cáscara de huevo, la de la base</title>
  <desc id="huevo-cascara-base-desc">Mitad de abajo de la cáscara de un huevo de gallina recién abierto, con la boca hacia la izquierda: por fuera naranja, con su sombra abajo; por dentro clara, con el borde roto en picos por donde se partió y curvo donde sigue el perfil del huevo. Es la mitad «cascara-derecha» del huevo abierto (huevo-roto.svg), con su misma geometría, en colores planos y a la escala de huevo-gallina. El centro de su boca está en x 43.3, y 68.1; se apoya en su punto más bajo (y 141). Luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
