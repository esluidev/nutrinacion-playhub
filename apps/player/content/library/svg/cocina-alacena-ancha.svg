<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 536" width="704" height="536" role="img" aria-labelledby="cocina-alacena-ancha-title cocina-alacena-ancha-desc">
  <title id="cocina-alacena-ancha-title">Cocina, junto a la alacena (ancha)</title>
  <desc id="cocina-alacena-ancha-desc">La cocina de la casa junto a la alacena, en una vista más ancha y con la mesa despejada: la alacena de dos puertas en la pared, a la derecha, y nada más. Es cocina-alacena.svg con un cuadro más de mantel (88 de ancho) y sin el salero y el pimentero, para lo que ocupa la mesa de lado a lado (el huevo abierto en su plato, con las mitades de la cáscara a los lados) o llena el alto (el vaso de agua). La misma cocina de la casa (cocina.svg): pared clara, casi blanca, y mesa con mantel a cuadros. Interior de tarjeta de 704 × 536. La mesa empieza en y 340 y llega hasta abajo: lo que va sobre ella se apoya entre y 440 y y 530, centrado en x 352; el centro (x 0–600) queda libre para lo que la escena ponga encima. Colores planos, luz desde arriba a la izquierda.</desc>
