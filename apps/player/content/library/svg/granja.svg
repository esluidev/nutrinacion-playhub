<svg xmlns="http://www.w3.org/2000/svg" width="580" height="520" viewBox="0 0 580 520" role="img" aria-labelledby="title desc">
  <title id="title">Granja</title>
  <desc id="desc">Granero de granja de frente en colores planos y formas gruesas, de la familia de la casa y la tienda: pared roja con su lado derecho y la franja bajo el techo en sombra, techo de dos pendientes por lado en madera oscura con el faldón derecho en sombra, pajar con paja asomando y portón con marco y cruz crema. Sin sombra de apoyo: el suelo lo pone quien la coloca. Luz desde arriba a la izquierda. Fondo transparente.</desc>
  <defs>
    <clipPath id="granja-pared-forma">
      <path d="M118 286 L172 186 L290 136 L408 186 L462 286 V454 Q462 480 436 480 H144 Q118 480 118 454 Z"/>
    </clipPath>
    <clipPath id="granja-pajar-hueco">
      <rect x="256" y="198" width="68" height="60" rx="10"/>
    </clipPath>
  </defs>

  <g id="granja">
