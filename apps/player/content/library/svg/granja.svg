        <path d="M252 248 L263 240 L261 234 L274 239 L283 233 L291 238 L304 232 L301 240 L315 237 L328 247 V261 H252Z" fill="#F2B239"/>
        <path d="M257 255 L278 244 L269 243 L286 250 L306 240 L319 247 M284 235 L297 245 M302 252 L326 244" fill="none" stroke="#FFC247" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M259 258 L282 251 M289 255 L310 250 M313 256 L327 251" fill="none" stroke="#FFC247" stroke-width="2.5" stroke-linecap="round"/>
      </g>
