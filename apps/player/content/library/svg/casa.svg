<svg xmlns="http://www.w3.org/2000/svg" width="580" height="520" viewBox="0 0 580 520" role="img" aria-labelledby="title desc">
  <title id="title">Casa</title>
  <desc id="desc">Casa de frente de la familia del granero y la tienda, en colores planos y formas gruesas: pared amarilla (al 86 % de saturación, no el 99 % de antes, que se veía de caramelo junto al granero) con su lado derecho y la franja bajo el techo en sombra; techo de teja terracota redondeado, más oscuro que la pared como el del granero, con el faldón derecho en sombra y su brillo; chimenea de ladrillo, ventana redonda y dos ventanas con cruz de cristal azul, alféizares crema y puerta de madera. Mismo dibujo y proporciones que antes: solo cambian los colores. Sin sombra de apoyo: el suelo lo pone quien la coloca. Luz desde arriba a la izquierda. Fondo transparente.</desc>
