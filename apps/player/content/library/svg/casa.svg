<svg xmlns="http://www.w3.org/2000/svg" width="580" height="520" viewBox="0 0 580 520" role="img" aria-labelledby="title desc">
  <title id="title">Casa</title>
  <desc id="desc">Casa de frente en colores planos y formas gruesas: pared crema con su lado derecho y la franja bajo el techo en sombra, techo coral redondeado con el faldón derecho en sombra, chimenea, ventana redonda, dos ventanas con cruz y puerta de madera. Sin sombra de apoyo: el suelo lo pone quien la coloca. Luz desde arriba a la izquierda. Fondo transparente.</desc>
  <defs>
    <clipPath id="casa-pared-forma">
      <path d="M116 264 L290 130 L464 264 V454 Q464 480 438 480 H142 Q116 480 116 454 Z"/>
    </clipPath>
  </defs>

  <g id="casa">
    <g id="chimenea">
      <rect x="370" y="102" width="58" height="118" rx="10" fill="#E2725E"/>
      <path d="M402 102 H418 Q428 102 428 112 V220 H402 Z" fill="#C95A48"/>
      <rect x="360" y="88" width="78" height="28" rx="12" fill="#EE8268"/>
    </g>

    <g id="pared">
      <path d="M116 264 L290 130 L464 264 V454 Q464 480 438 480 H142 Q116 480 116 454 Z" fill="#FFE6B5"/>
      <g clip-path="url(#casa-pared-forma)" fill="#F5CC8A">
        <path d="M100 282 L290 140 L480 282 V306 L290 164 L100 306 Z"/>
        <rect x="444" y="100" width="36" height="400"/>
      </g>
    </g>

    <g id="techo" fill="none" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
      <path d="M290 96 L496 262" stroke="#D95445"/>
      <path d="M84 262 L290 96" stroke="#F26B5B"/>
      <path d="M108 228 L254 110" stroke="#F99A88" stroke-width="9"/>
    </g>

    <g id="ventana-superior">
