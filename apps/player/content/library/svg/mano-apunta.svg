    <g id="mano">
      <use href="#mano-puno-forma" fill="#FBBD89"/>
      <g clip-path="url(#mano-piel-limite)">
        <!-- Borde iluminado y volumen resueltos únicamente con superficies planas. -->
        <path d="M142 120 C124 120 112 133 113 150 C114 164 123 179 132 193 L184 277 L174 266 L121 191 C103 163 101 146 114 131 C121 122 131 118 142 120Z" fill="#FFD0A0"/>
        <path d="M112 144 C111 162 120 180 132 197 L184 279 C188 285 184 287 180 281 L122 194 C109 174 102 156 112 144Z" fill="#F2A36B"/>
        <path d="M135 281 C131 301 145 321 168 336 C192 352 221 357 244 350 C249 348 252 350 252 354 C253 359 259 364 267 366 L267 385 C231 381 187 368 158 349 C134 334 122 309 129 291Z" fill="#F2A36B"/>
        <path d="M341 185 C358 210 364 236 363 260 C364 279 358 298 348 315 L355 329 C373 307 380 281 374 252 C370 224 358 197 341 185Z" fill="#F2A36B"/>
      </g>
      <use href="#mano-puno-forma" fill="none" stroke="#DF8B51" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M208 195 L220 214 M256 185 L263 193 M305 182 L308 186 M163 261 L185 282" fill="none" stroke="#DF8B51" stroke-width="5.5" stroke-linecap="round"/>
    </g>
    <g id="manga" transform="translate(10 -3)">
      <use href="#mano-manga-forma" fill="#3186ED"/>
      <g clip-path="url(#mano-manga-limite)">
        <path d="M216 367 C266 359 317 332 352 302 L374 301 C384 309 369 327 357 337 C327 362 280 384 240 389 L231 382Z" fill="#4D9CF6"/>
        <path d="M222 369 L242 366 C241 380 245 398 255 410 C264 423 281 422 297 419 C335 412 375 391 399 364 C395 386 380 401 358 412 C330 427 303 437 282 439 C258 442 243 432 234 414 C226 399 221 383 222 369Z" fill="#246FD0"/>
      </g>
      <use href="#mano-manga-forma" fill="none" stroke="#2B79DB" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
