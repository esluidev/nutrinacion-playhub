<svg xmlns="http://www.w3.org/2000/svg" width="206" height="212" viewBox="0 0 206 212" role="img" aria-labelledby="title desc">
  <title id="title">Mano que apunta</title>
  <desc id="desc">Mano derecha basada en la primera referencia de Luis: índice inclinado hacia arriba a la izquierda, tres nudillos bajos, pulgar recogido y manga azul intenso. Piel melocotón, contorno naranja cálido y sombras de color plano. Sin degradados, filtros ni fondo. Punto de contacto en (20, 11.5). Diseño estático editable para indicar pulsación o arrastre.</desc>
  <metadata>Fuente maestra: mano-apunta.svg. La primera lámina de mano aportada por Luis gobierna forma, proporciones y colores; no sustituirlos por la paleta del UI Kit. No se permiten degradados. Anclaje de contacto: 20,11.5 en el viewBox. Conservar los IDs mano-apunta, mano y manga. Ondas opcionales: ondas-pulsar.svg, centradas en el contacto y dibujadas detrás de la mano.</metadata>
  <defs>
    <path id="mano-puno-forma" d="M114 134 C121 120 139 115 153 122 C165 128 173 140 181 153 L208 195 C218 178 241 173 256 185 C269 168 291 168 305 182 C318 173 335 178 346 193 C359 210 367 233 369 257 C372 282 366 307 351 326 L266 380 L247 364 C215 370 183 361 159 344 C138 329 127 309 132 288 C135 272 148 259 163 261 L122 192 C109 171 103 153 114 134Z"/>
    <clipPath id="mano-piel-limite"><use href="#mano-puno-forma"/></clipPath>
    <path id="mano-manga-forma" d="M221 371 C266 362 315 338 350 308 C358 301 367 299 376 305 C390 316 398 332 400 349 C403 370 392 388 375 400 C348 419 312 433 283 436 C262 439 246 431 237 416 C228 402 222 386 221 371Z"/>
    <clipPath id="mano-manga-limite"><use href="#mano-manga-forma"/></clipPath>
  </defs>
  <!-- Coordenadas tomadas de la silueta grande de la referencia; encuadre propio del asset. -->
