<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 536" width="616" height="536" role="img" aria-labelledby="cocina-ventana-title cocina-ventana-desc">
  <title id="cocina-ventana-title">Cocina, junto a la ventana</title>
  <desc id="cocina-ventana-desc">La cocina de la casa junto a la ventana: una ventana ancha con su cruz, cielo y una nube, cortinas verdes a los lados y una tabla de cortar apoyada en la pared a la derecha. Solo cosas de cocina, y pocas. La misma cocina de la casa (cocina.svg): pared clara, casi blanca, y mesa con mantel a cuadros. Interior de tarjeta de 616 × 536. La mesa empieza en y 340 y llega hasta abajo: lo que va sobre ella se apoya entre y 440 y y 530, centrado en x 308; el centro (x 120–500) queda libre para lo que la escena ponga encima. Colores planos, luz desde arriba a la izquierda.</desc>
