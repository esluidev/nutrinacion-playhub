<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 456" width="616" height="456" role="img" aria-labelledby="cocina-title cocina-desc">
  <title id="cocina-title">Cocina de la casa</title>
  <desc id="cocina-desc">La cocina de la casa vista de cerca, para el interior de una tarjeta: la pared clara, casi blanca, con el matiz amarillo de la casa, su ventana con cruz y cristal azul, cortinas en el coral del techo, el refrigerador al fondo a la derecha (gris azulado muy claro, con congelador, asas, un imán y un dibujo), y la mesa con su mantel a cuadros. Lo que va en la mesa (el cartón) lo pone quien coloca el escenario, centrado en x 308 y apoyado en y 352. Colores planos, luz desde arriba a la izquierda.</desc>
  <g id="cocina">
    <rect id="pared" x="0" y="0" width="616" height="456" fill="#FFF8E7"/>
    <rect id="pared-sombra" x="0" y="0" width="616" height="22" fill="#FFEFCB"/>
    <g id="ventana">
      <rect x="208" y="58" width="200" height="164" rx="30" fill="#F2DFB8"/>
      <rect x="218" y="68" width="180" height="144" rx="24" fill="#6BC7F0"/>
      <path d="M236 108 V96 Q236 84 248 84 H262" fill="none" stroke="#C2EBFB" stroke-width="9" stroke-linecap="round"/>
      <rect x="303" y="68" width="10" height="144" fill="#F2DFB8"/>
      <rect x="218" y="135" width="180" height="10" fill="#F2DFB8"/>
      <rect x="196" y="214" width="224" height="18" rx="9" fill="#F2DFB8"/>
    </g>
    <g id="cortinas">
