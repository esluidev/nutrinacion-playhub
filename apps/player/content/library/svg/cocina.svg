      <path id="cortina-izquierda" d="M170 48 H226 Q218 120 222 168 Q212 182 214 238 H182 Q186 170 176 150 Q164 100 170 48 Z" fill="#F26B5B"/>
      <path id="cortina-izquierda-pliegue" d="M204 48 H226 Q218 120 222 168 Q212 182 214 238 H202 Q204 176 208 150 Q198 100 204 48 Z" fill="#D95445"/>
      <path id="cortina-izquierda-luz" d="M178 56 H186 Q182 104 186 140 H180 Q174 100 178 56 Z" fill="#F99A88"/>
      <path id="cortina-derecha" d="M446 48 H390 Q398 120 394 168 Q404 182 402 238 H434 Q430 170 440 150 Q452 100 446 48 Z" fill="#F26B5B"/>
      <path id="cortina-derecha-pliegue" d="M446 48 H424 Q430 100 438 150 Q430 170 434 238 H422 Q424 176 428 150 Q420 100 424 48 Z" fill="#D95445"/>
      <path id="cortina-derecha-luz" d="M398 56 H406 Q402 104 406 140 H400 Q394 100 398 56 Z" fill="#F99A88"/>
    </g>
    <g id="refrigerador">
      <rect id="refrigerador-cuerpo" x="478" y="88" width="118" height="280" rx="16" fill="#DDE8F1"/>
      <path id="refrigerador-lado" d="M584 92.5 A16 16 0 0 1 596 104 V368 H584 Z" fill="#C4D6E4"/>
      <rect id="refrigerador-junta" x="478" y="170" width="118" height="6" fill="#C4D6E4"/>
      <rect id="refrigerador-asa-congelador" x="490" y="132" width="9" height="28" rx="4.5" fill="#9DB8CE"/>
      <rect id="refrigerador-asa-puerta" x="490" y="188" width="9" height="56" rx="4.5" fill="#9DB8CE"/>
      <g id="dibujo">
        <rect x="530" y="200" width="40" height="46" rx="5" fill="#FFF4DC"/>
        <circle cx="550" cy="219" r="8" fill="#FFD34B"/>
        <rect x="535" y="235" width="30" height="5" rx="2.5" fill="#8DD06C"/>
        <circle id="iman-dibujo" cx="550" cy="201" r="5.5" fill="#F26B5B"/>
      </g>
      <circle id="iman-congelador" cx="560" cy="124" r="6" fill="#6BC7F0"/>
    </g>
    <g id="mesa">
      <rect id="mantel-frente" x="0" y="370" width="616" height="86" fill="#DCECF8"/>
      <g id="mantel-cuadros" fill="#C3DEF2">
        <rect x="20" y="370" width="40" height="86"/><rect x="100" y="370" width="40" height="86"/><rect x="180" y="370" width="40" height="86"/><rect x="260" y="370" width="40" height="86"/><rect x="340" y="370" width="40" height="86"/><rect x="420" y="370" width="40" height="86"/><rect x="500" y="370" width="40" height="86"/><rect x="580" y="370" width="40" height="86"/>
        <rect x="0" y="400" width="616" height="26"/>
