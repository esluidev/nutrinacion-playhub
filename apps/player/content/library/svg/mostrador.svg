<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 456" width="616" height="456" role="img" aria-labelledby="mostrador-title mostrador-desc">
  <title id="mostrador-title">La tienda por dentro</title>
  <desc id="mostrador-desc">La tienda por dentro, para el interior de una tarjeta: arriba la cornisa turquesa y el toldo a rayas menta y crema con sus ondas, como en la tienda; la pared menta clara con un mueble de estantes de madera a cada lado llenas de productos (frascos, botellas, manzanas, una pera, cajas, pan, tomates y queso), y abajo el mostrador azul de la fachada. Lo que se vende (el cartón) lo pone quien coloca el escenario, centrado en x 308 y apoyado en el mostrador, en y 352. Colores planos, luz desde arriba a la izquierda.</desc>
