<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 456" width="616" height="456" role="img" aria-labelledby="mostrador-title mostrador-desc">
  <title id="mostrador-title">La tienda por dentro</title>
  <desc id="mostrador-desc">La tienda por dentro, para el interior de una tarjeta, de la familia de la tienda de fuera: arriba la cornisa de madera y el toldo a rayas coral y crema con sus ondas, como en la fachada; la pared clara, casi blanca, con un frío apenas azul y su franja en sombra bajo el toldo; a cada lado un mueble de estantes pintado del azul de la fachada, con pocas cosas grandes (frascos con tapa roja y verde, manzanas y botellas), ninguna de los colores del huevo; y abajo el mostrador, con el frente azul de la fachada y la cubierta de madera oscura, que separa el cartón, kraft claro, de su apoyo. Lo que se vende (el cartón) lo pone quien coloca el escenario, centrado en x 308 y apoyado en el mostrador, en y 352. Colores planos, luz desde arriba a la izquierda.</desc>
