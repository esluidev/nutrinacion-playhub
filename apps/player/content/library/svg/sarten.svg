<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 120" width="272" height="120" role="img" aria-labelledby="sarten-title sarten-desc">
  <title id="sarten-title">Sartén</title>
  <desc id="sarten-desc">Sartén azul marino vista desde arriba y de frente, con el mango hacia arriba a la derecha, en el lenguaje de la lámina de assets. Se apoya en el centro de la base de su cuenco (x 104, y 117). Lo que se cocina descansa en el fondo, con su base en x 104, y 86. Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
  <g id="sarten">
    <path id="mango" fill-rule="evenodd" d="M176 44 L250 16 Q261 12 266 22 Q270 32 259 37 L188 64 Z M246.5 21.5 a5.5 4.2 -20 1 0 10.4 3.6 a5.5 4.2 -20 1 0 -10.4 -3.6 Z" fill="#2F4868"/>
    <path id="mango-sombra" d="M188 64 L259 37 Q266 34 267.4 28 Q266 32 259 33.5 L184 58 Z" fill="#263C58"/>
    <path id="mango-luz" d="M196 40 L238 24.4 L239.6 28.4 L197.6 44 Z" fill="#456389"/>
    <path id="pared" d="M4 60 C4 84 30 112 62 117 H146 C178 112 204 84 204 60 Z" fill="#2F4868"/>
    <path id="pared-sombra" d="M146 117 C178 112 204 84 204 60 H186 C186 82 172 104 130 117 Z" fill="#263C58"/>
    <path id="pared-luz" d="M10 70 C14 86 26 100 42 108 C30 96 22 82 19 68 Z" fill="#456389"/>
    <ellipse id="borde" cx="104" cy="60" rx="100" ry="36" fill="#456389"/>
    <path id="borde-luz" d="M8 54 C16 38 50 26.5 96 24.6 C56 28.5 26 40 14 56 Z" fill="#6A8AB2"/>
    <ellipse id="interior" cx="104" cy="62" rx="90" ry="30" fill="#2C4463"/>
    <ellipse id="fondo" cx="104" cy="68" rx="71" ry="21" fill="#3A5578"/>
    <path id="fondo-luz" d="M40 66 C46 56 66 50 90 48.6 C70 52 54 58 47 68 Z" fill="#4B6A90"/>
