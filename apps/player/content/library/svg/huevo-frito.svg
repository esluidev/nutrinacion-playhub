<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 56" width="150" height="56" role="img" aria-labelledby="huevo-frito-title huevo-frito-desc">
  <title id="huevo-frito-title">Huevo frito</title>
  <desc id="huevo-frito-desc">Huevo frito bien cocido, visto de frente y un poco desde arriba: la clara blanca y opaca y la yema firme, sin brillo. Se apoya en el centro de su base (x 75, y 56). Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
