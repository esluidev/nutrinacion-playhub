        <path d="M576 42 V9 a6 5 0 0 1 12 0 V42 Z"/>
      </g>
      <g id="postes-derecha-sombra" fill="#A96E3F">
        <path d="M492 42 V5.6 a6 5 0 0 1 4 3.4 V42 Z"/>
        <path d="M538 42 V5.6 a6 5 0 0 1 4 3.4 V42 Z"/>
        <path d="M584 42 V5.6 a6 5 0 0 1 4 3.4 V42 Z"/>
      </g>
      <g id="tablas-derecha">
