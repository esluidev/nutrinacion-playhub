<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-labelledby="suelo-corral-title suelo-corral-desc">
  <title id="suelo-corral-title">Suelo de corral</title>
  <desc id="suelo-corral-desc">Franja de suelo de un corral para el fondo de una tarjeta: tierra con briznas de paja y un tramo de cerca de madera a cada lado. Sin cielo. Lo que se apoya va en y 36, en el centro. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: cercas (atrás) → tierra → manchas → paja → piedras. El centro (x 130–470) queda libre para lo que se
       apoya. Ancla: centro, y 36. -->
  <g id="suelo-corral">
    <g id="cerca-izquierda">
      <g id="postes-izquierda" fill="#C68752">
        <path d="M12 42 V9 a6 5 0 0 1 12 0 V42 Z"/>
        <path d="M58 42 V9 a6 5 0 0 1 12 0 V42 Z"/>
        <path d="M104 42 V9 a6 5 0 0 1 12 0 V42 Z"/>
      </g>
      <g id="postes-izquierda-sombra" fill="#A96E3F">
        <path d="M20 42 V5.6 a6 5 0 0 1 4 3.4 V42 Z"/>
        <path d="M66 42 V5.6 a6 5 0 0 1 4 3.4 V42 Z"/>
        <path d="M112 42 V5.6 a6 5 0 0 1 4 3.4 V42 Z"/>
      </g>
      <g id="tablas-izquierda">
        <rect x="4" y="12" width="120" height="8" rx="2" fill="#DCA06A"/>
        <rect x="4" y="18" width="120" height="2.5" rx="1" fill="#BF8350"/>
        <rect x="4" y="26" width="120" height="8" rx="2" fill="#DCA06A"/>
        <rect x="4" y="32" width="120" height="2.5" rx="1" fill="#BF8350"/>
