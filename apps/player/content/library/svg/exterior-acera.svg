<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 456" width="616" height="456" role="img" aria-labelledby="exterior-acera-title exterior-acera-desc">
  <title id="exterior-acera-title">Calle, por fuera</title>
  <desc id="exterior-acera-desc">La calle de la tienda al aire libre, para el interior de una tarjeta: cielo claro, casi blanco, con dos nubes; la banqueta de losetas grises (la de isla-acera) de lado a lado, con una jardinera a cada lado; el bordillo; y la calzada abajo, con su línea discontinua. Exterior de tarjeta de 616 × 456: el horizonte en y 334; un edificio se apoya en y 352, centrado en x 308; quien está de pie, en y 382; lo que llega, delante, sobre la banqueta, en y 408. Colores planos, luz desde arriba a la izquierda.</desc>
