<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 166" width="1040" height="166" role="img" aria-labelledby="isla-corral-larga-title isla-corral-larga-desc">
  <title id="isla-corral-larga-title">Isla de corral larga</title>
  <desc id="isla-corral-larga-desc">La isla del corral (isla-corral.svg) a lo ancho, para apoyar una fila de cosas sueltas de la granja (los tres nidos): la misma tierra con su orilla de atrás apenas ondulada, las esquinas redondeadas del tablero (26) y el canto de delante más oscuro; al fondo, un tramo de cerca entre un apoyo y el siguiente; manchas, unas piedras y briznas de paja delante de cada uno. Lienzo de 1040 × 166, el ancho de la columna del juego: lo que se apoya va en y 128, centrado en x 160, 520 y 880 (una fila de tres columnas de 320 con 40 entre ellas); debajo de cada uno, la tierra queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: canto (delante, abajo) → tierra → luz de la orilla de atrás → manchas → cercas (al fondo, entre los apoyos) → paja → piedras. -->
