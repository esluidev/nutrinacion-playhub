    <g id="tierra">
      <path id="tierra-canto" d="M28 48 C62.4 48 75.6 44 110 44 C144.4 44 157.6 52 192 52 C226.4 52 239.6 44 274 44 C308.4 44 321.6 52 356 52 C390.4 52 403.6 44 438 44 C472.4 44 485.6 52 520 52 C554.4 52 567.6 44 602 44 C636.4 44 649.6 52 684 52 C718.4 52 731.6 44 766 44 C800.4 44 813.6 52 848 52 C882.4 52 895.6 44 930 44 C964.4 44 977.6 48 1012 48 A26 26 0 0 1 1038 74 V137 A26 26 0 0 1 1012 163 H28 A26 26 0 0 1 2 137 V74 A26 26 0 0 1 28 48 Z" fill="#CC9A5E"/>
