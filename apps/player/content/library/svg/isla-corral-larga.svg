      <path id="tierra-luz" d="M2 74 A26 26 0 0 1 28 48 C62.4 48 75.6 44 110 44 C144.4 44 157.6 52 192 52 C226.4 52 239.6 44 274 44 C308.4 44 321.6 52 356 52 C390.4 52 403.6 44 438 44 C472.4 44 485.6 52 520 52 C554.4 52 567.6 44 602 44 C636.4 44 649.6 52 684 52 C718.4 52 731.6 44 766 44 C800.4 44 813.6 52 848 52 C882.4 52 895.6 44 930 44 C964.4 44 977.6 48 1012 48 A26 26 0 0 1 1038 74 C1038 65 1026 59 1012 59 C977.6 59 964.4 55 930 55 C895.6 55 882.4 63 848 63 C813.6 63 800.4 55 766 55 C731.6 55 718.4 63 684 63 C649.6 63 636.4 55 602 55 C567.6 55 554.4 63 520 63 C485.6 63 472.4 55 438 55 C403.6 55 390.4 63 356 63 C321.6 63 308.4 55 274 55 C239.6 55 226.4 63 192 63 C157.6 63 144.4 55 110 55 C75.6 55 62.4 59 28 59 C14 59 2 65 2 74 Z" fill="#F1D3A2"/>
      <g id="manchas" fill="#DDB27A">
        <ellipse cx="340" cy="112" rx="34" ry="7"/>
        <ellipse cx="700" cy="110" rx="36" ry="7.5"/>
        <ellipse cx="62" cy="142" rx="24" ry="5"/>
        <ellipse cx="978" cy="142" rx="26" ry="5.5"/>
        <ellipse cx="610" cy="143" rx="22" ry="4.5"/>
      </g>
    </g>
    <!-- La cerca: un tramo al fondo entre nido y nido, clavado en la tierra. Los postes y las tablas de isla-corral, a 1,3. -->
    <g id="cerca-1" transform="translate(301 12) scale(1.3)">
