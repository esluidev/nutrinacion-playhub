<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 166" width="560" height="166" role="img" aria-labelledby="isla-campo-title isla-campo-desc">
  <title id="isla-campo-title">Isla de campo</title>
  <desc id="isla-campo-desc">Un trozo de campo: la forma de las islas (isla-pasto.svg), con la orilla de atrás ondulada, las esquinas redondeadas del tablero (26) y el canto de delante más oscuro, y el suelo del campo de las tarjetas (suelo-campo.svg): hierba de un verde amarillento, matitas, semillas y, a cada lado, una mata de hierba alta con sus espigas. Sirve suelta o dentro de una tarjeta. Lienzo de 560 × 166: lo que va al fondo se apoya en y 72; quien está de pie, en y 100; lo que va delante, entre y 120 y y 130; el centro (x 110–450) queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: canto (delante, abajo) → hierba → luz de la orilla de atrás → matitas → semillas → hierba alta y espigas a los lados. -->
