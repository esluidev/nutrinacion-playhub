<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 166" width="1040" height="166" role="img" aria-labelledby="tarima-larga-title tarima-larga-desc">
  <title id="tarima-larga-title">Tarima de madera larga</title>
  <desc id="tarima-larga-desc">Una tarima baja de tablas de madera, a lo ancho, para apoyar una fila de cosas sueltas que se comparan y que no son de un mismo lugar (los nidos de la gallina, la codorniz y el pato): no es el suelo de ningún sitio. Las medidas y los apoyos de la isla larga (isla-corral-larga.svg), pero más honda: su orilla de atrás, recta porque está hecha a mano, va en y 10, para que lo que se apoya quede entero sobre ella, también por detrás. Cuatro tablas a lo largo con sus juntas y sus clavos, unas vetas, unas briznas de paja caídas de los nidos entre uno y otro, las esquinas redondeadas del tablero (26) y el canto de delante más oscuro, que le da cuerpo. Lienzo de 1040 × 166: lo que se apoya va en y 128, centrado en x 160, 520 y 880; debajo de cada uno, la madera queda libre. Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
