<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-labelledby="suelo-estanque-title suelo-estanque-desc">
  <title id="suelo-estanque-title">Suelo de estanque</title>
  <desc id="suelo-estanque-desc">Franja de suelo a la orilla de un estanque para el fondo de una tarjeta: una orilla de pasto atrás, el agua delante con su borde de arena y ondas, y juncos a cada lado. Sin cielo. Lo que se apoya va en y 36, en el centro, sobre la orilla. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: juncos (atrás) → orilla → arena → agua → ondas. La orilla del centro (x 120–480, y 30–56) queda libre para
       lo que se apoya. Ancla: centro, y 36. -->
