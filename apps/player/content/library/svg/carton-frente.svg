  <title id="carton-frente-title">Cartón de huevos (frente)</title>
  <desc id="carton-frente-desc">Capa de delante de un cartón de huevos abierto de dos huecos: el frente abombado de cada hueco, con sus nervios de cartón, la unión del centro y la base. Va delante de los huevos, sobre carton.svg, en el mismo lienzo. Colores planos, luz desde arriba a la izquierda.</desc>
