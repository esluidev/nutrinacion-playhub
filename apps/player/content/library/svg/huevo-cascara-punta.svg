<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 145" width="140" height="145" role="img" aria-labelledby="huevo-cascara-punta-title huevo-cascara-punta-desc">
  <title id="huevo-cascara-punta-title">Media cáscara de huevo, la de la punta</title>
  <desc id="huevo-cascara-punta-desc">Mitad de arriba de la cáscara de un huevo de gallina recién abierto, con la boca hacia la derecha: por fuera naranja, con su sombra abajo; por dentro clara, con el borde roto en picos por donde se partió y curvo donde sigue el perfil del huevo. Es la mitad «cascara-izquierda» del huevo abierto (huevo-roto.svg), con su misma geometría, en colores planos y a la escala de huevo-gallina. El centro de su boca está en x 101.9, y 66.4; se apoya en su punto más bajo (y 142). Luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
