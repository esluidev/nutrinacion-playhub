    <g clip-path="url(#huevo-yema-cocida-forma)">
      <path id="yema" d="M5 40C5 20 19 5 38 5C57 5 71 20 71 40C71 54 57 62 38 62C19 62 5 54 5 40Z" fill="#F7C143" transform="translate(-5 -5)"/>
    </g>
    <path id="yema-luz" d="M14 30C17 19 26 12 37 11C29 15 22 22 19 32Z" fill="#FBD877"/>
    <circle id="granito-1" cx="46" cy="27" r="2.2" fill="#E5A82E"/>
    <circle id="granito-2" cx="30" cy="42" r="1.8" fill="#E5A82E"/>
    <circle id="granito-3" cx="52" cy="44" r="2" fill="#E5A82E"/>
  </g>
</svg>
