<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 64" width="76" height="64" role="img" aria-labelledby="huevo-yema-cocida-title huevo-yema-cocida-desc">
  <title id="huevo-yema-cocida-title">Yema de huevo cocida</title>
  <desc id="huevo-yema-cocida-desc">La yema de un huevo hervido bien cocido, sacada de la clara: redonda, firme y sin brillo, en el amarillo del huevo hervido, con su sombra en media luna abajo a la derecha, una luz suave arriba a la izquierda y tres granitos que dicen que está cocida. Se apoya en el centro de su base (x 38, y 62). Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
  <defs>
    <clipPath id="huevo-yema-cocida-forma"><path d="M5 40C5 20 19 5 38 5C57 5 71 20 71 40C71 54 57 62 38 62C19 62 5 54 5 40Z"/></clipPath>
  </defs>
  <g id="huevo-yema-cocida">
