  <title id="carton-3-frente-title">Cartón de tres huevos (frente)</title>
  <desc id="carton-3-frente-desc">Capa de delante de un cartón de huevos abierto de tres huecos: el frente abombado de cada hueco, con sus nervios, las uniones y la base. Va delante de los huevos, sobre carton-3.svg, en el mismo lienzo. Dibujo de prueba. Lienzo de 600 × 170. Cada huevo se centra en x 108, x 300 y x 492 con su base en y 152; el cartón se apoya en y 169. Colores planos, luz desde arriba a la izquierda.</desc>
