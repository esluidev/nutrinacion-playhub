<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 166" width="1040" height="166" role="img" aria-labelledby="isla-pasto-larga-title isla-pasto-larga-desc">
  <title id="isla-pasto-larga-title">Isla de pasto larga</title>
  <desc id="isla-pasto-larga-desc">La isla del jardín (isla-pasto.svg) a lo ancho, para apoyar una fila de cosas sueltas en el tablero: la misma orilla de atrás apenas ondulada, las esquinas redondeadas del tablero (26) y el canto de delante más oscuro; una mata redonda en cada extremo, matitas y flores entre un apoyo y el siguiente y unas briznas de paja delante de cada uno. Lienzo de 1040 × 166, el ancho de la columna del juego: lo que se apoya va en y 128, centrado en x 160, 520 y 880 (una fila de tres columnas de 320 con 40 entre ellas); debajo de cada uno, el pasto queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: canto (delante, abajo) → pasto → luz de la orilla de atrás → matitas → paja → flores → matas en los extremos. -->
