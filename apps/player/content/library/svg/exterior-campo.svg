<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 536" width="616" height="536" role="img" aria-labelledby="exterior-campo-title exterior-campo-desc">
  <title id="exterior-campo-title">Campo, por fuera</title>
  <desc id="exterior-campo-desc">El campo de la codorniz al aire libre, para el interior de una tarjeta: cielo claro, casi blanco, con dos nubes; una loma suave al fondo; y la hierba clara del campo (la de isla-campo) hasta abajo y de lado a lado, con matitas y semillas, y hierba alta con espigas en las dos esquinas de abajo. Exterior de tarjeta de 616 × 536: el horizonte en y 334; lo que va al fondo se apoya en y 432; quien está de pie, en y 462, centrado en x 308; lo que llega, delante, en y 488; el centro queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
