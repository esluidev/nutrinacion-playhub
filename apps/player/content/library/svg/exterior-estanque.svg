<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 536" width="616" height="536" role="img" aria-labelledby="exterior-estanque-title exterior-estanque-desc">
  <title id="exterior-estanque-title">Estanque, por fuera</title>
  <desc id="exterior-estanque-desc">El estanque del pato al aire libre, para el interior de una tarjeta: cielo claro, casi blanco, con dos nubes; el pasto de la orilla (el de isla-estanque) de lado a lado; delante, el estanque con su arena, el agua y sus ondas, que sigue más allá del borde de abajo; y juncos a los lados. Exterior de tarjeta de 616 × 536: el horizonte en y 334; quien está de pie se apoya en la orilla, en y 462, centrado en x 308; lo que va al fondo, en y 432. Colores planos, luz desde arriba a la izquierda.</desc>
