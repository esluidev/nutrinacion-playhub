<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 536" width="616" height="536" role="img" aria-labelledby="cocina-foto-title cocina-foto-desc">
  <title id="cocina-foto-title">Cocina, para la foto del grupo</title>
  <desc id="cocina-foto-desc">La cocina de la casa para la foto del grupo de la Despedida, distinta de las demás tarjetas de la cocina: la ventana con su cruz, cielo y una nube, corrida a la izquierda y sin cortinas; el refrigerador a la derecha, con su imán y un dibujo (el de cocina-refrigerador.svg); y la mesa con un mantel de cuadros verdes. La misma pared clara, casi blanca. Interior de tarjeta de 616 × 536. La mesa empieza en y 340 y llega hasta abajo: lo que va sobre ella se apoya entre y 440 y y 530, centrado en x 308; los niños de la foto (ninos-foto.svg) van detrás de ella. Colores planos, luz desde arriba a la izquierda.</desc>
