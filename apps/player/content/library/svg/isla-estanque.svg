<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 166" width="560" height="166" role="img" aria-labelledby="isla-estanque-title isla-estanque-desc">
  <title id="isla-estanque-title">Isla de estanque</title>
  <desc id="isla-estanque-desc">Un trozo de orilla con su estanque: la forma de las islas (isla-pasto.svg), con la orilla de atrás ondulada, las esquinas redondeadas del tablero (26) y el canto de delante más oscuro, y el suelo del estanque de las tarjetas (suelo-estanque.svg): el pasto de la orilla, el agua delante con su borde de arena y sus ondas, y juncos a cada lado. Sirve suelta o dentro de una tarjeta. Lienzo de 560 × 166: lo que va al fondo se apoya en y 72; quien está de pie, en y 100, en la orilla; el agua, delante, de y 108 a y 150; el centro (x 110–450) queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
