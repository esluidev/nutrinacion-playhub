  <title id="huevo-hervido-title">Huevo hervido partido</title>
  <desc id="huevo-hervido-desc">Huevo hervido bien cocido, partido en dos mitades: la clara blanca y la yema firme en el centro de cada una. Se apoya en el centro de su base (x 75, y 86). Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
