        <path d="M268 365 Q282 374 280 390 Q278 406 264 409 Q273 398 273 387 Q273 375 268 365 Z" fill="#EB8649"/>
        <ellipse cx="297" cy="389" rx="16" ry="21" fill="#FFF1DE"/>
