<svg xmlns="http://www.w3.org/2000/svg" width="580" height="500" viewBox="0 0 580 500" role="img" aria-labelledby="title desc">
  <title id="title">Tienda</title>
  <desc id="desc">Tienda de barrio de frente en colores planos y formas gruesas: cornisa turquesa fina, toldo a rayas menta y crema con ondas, fachada crema con su lado derecho y la franja bajo el toldo en sombra, escaparate con una manzana y dos huevos, y puerta turquesa con cristal. Sin texto, para que sirva en cualquier idioma, y sin sombra de apoyo: el suelo lo pone quien la coloca. Luz desde arriba a la izquierda. Fondo transparente.</desc>
  <defs>
    <clipPath id="tienda-fachada-forma">
      <path d="M108 206 H472 V436 Q472 462 446 462 H134 Q108 462 108 436 Z"/>
    </clipPath>
  </defs>

  <!-- Escalada desde su base para ocupar el lienzo como la casa: apoyada en y 480. -->
