    <g id="puerta">
      <path d="M352 462 V334 Q352 316 370 316 H430 Q448 316 448 334 V462 Z" fill="#2FB3AE"/>
      <path d="M428 316 H430 Q448 316 448 334 V462 H428 Z" fill="#23968F"/>
