<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-labelledby="suelo-campo-title suelo-campo-desc">
  <title id="suelo-campo-title">Suelo de campo</title>
  <desc id="suelo-campo-desc">Franja de suelo de un campo para el fondo de una tarjeta: hierba de un verde amarillento, matas de hierba alta con espigas a cada lado y semillas. Sin cielo. Lo que se apoya va en y 36, en el centro. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: hierba alta (atrás) → espigas → hierba → matitas → semillas. El centro (x 120–480) queda libre para lo que
       se apoya. Ancla: centro, y 36. -->
