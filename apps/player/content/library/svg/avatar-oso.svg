<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="-30 -30 300 300" role="img" aria-labelledby="avatar-oso-title avatar-oso-desc">
  <title id="avatar-oso-title">Avatar · oso</title>
  <desc id="avatar-oso-desc">Avatar de PlayHub: la cabeza de un oso pardo: orejas redondas y hocico claro, de frente, para un círculo. El círculo y su fondo los pone quien lo coloca. Fuente maestra: avatar-oso.svg. Colores planos, sin contorno, con la luz arriba a la izquierda; los ojos, como los de las aves de PlayHub. Las dos mitades son iguales: el eje está en x 120. El dibujo ocupa el cuadrado de 240 del centro del lienzo, con 30 de aire por cada lado.</desc>
  <g id="avatar-oso-orejas">
    <circle cx="60" cy="70" r="30" fill="#B47C52" />
    <circle cx="180" cy="70" r="30" fill="#B47C52" />
    <circle cx="60" cy="70" r="16" fill="#EACBA5" />
    <circle cx="180" cy="70" r="16" fill="#EACBA5" />
  </g>
  <g id="avatar-oso-cabeza">
