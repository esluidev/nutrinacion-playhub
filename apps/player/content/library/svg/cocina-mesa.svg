<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1028 488" width="1028" height="488" role="img" aria-labelledby="cocina-mesa-title cocina-mesa-desc">
  <title id="cocina-mesa-title">Cocina, la mesa de cerca</title>
  <desc id="cocina-mesa-desc">La mesa de la cocina de la casa vista de cerca, para una tarjeta grande de 1040 por 500: arriba, la pared clara con la ventana y sus cortinas verdes a la izquierda y, a la derecha, la alacena y el refrigerador, que queda detrás de la mesa; abajo, la mesa con su mantel a cuadros, que empieza en y 216. Lo que va sobre la mesa se apoya entre y 300 y y 470. El centro (x 380–650) queda libre de arriba abajo. Colores planos, luz desde arriba a la izquierda.</desc>
