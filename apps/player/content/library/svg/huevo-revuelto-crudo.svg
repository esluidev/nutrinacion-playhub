  <title id="huevo-revuelto-crudo-title">Huevo batido</title>
  <desc id="huevo-revuelto-crudo-desc">Huevo crudo batido: un charco amarillo, liso y brillante. Se apoya en el centro de su base (x 75, y 50). Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
