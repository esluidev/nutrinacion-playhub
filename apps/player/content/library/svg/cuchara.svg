<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 200" width="60" height="200" role="img" aria-labelledby="cuchara-title cuchara-desc">
  <title id="cuchara-title">Cuchara de madera</title>
  <desc id="cuchara-desc">Cuchara de madera naranja, con la pala arriba, en el lenguaje de la lámina de assets. El centro de su pala está en x 30, y 40: ahí se apoya y sobre ese punto gira. Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
