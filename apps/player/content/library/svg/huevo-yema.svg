<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 86" width="120" height="86" role="img" aria-labelledby="huevo-yema-title huevo-yema-desc">
  <title id="huevo-yema-title">Yema de huevo cruda</title>
  <desc id="huevo-yema-desc">Yema cruda, entera y alta, vista de frente y un poco desde arriba: amarilla, con su sombra en media luna abajo a la derecha y un reflejo arriba a la izquierda. Es la misma yema del huevo recién abierto en la sartén. Se apoya en el centro de su base (x 60, y 82). Colores planos, luz desde arriba a la izquierda, sin sombra de apoyo.</desc>
  <defs>
    <clipPath id="huevo-yema-forma"><path d="M6 52C6 24 28 4 60 4C92 4 114 24 114 52C114 70 92 82 60 82C28 82 6 70 6 52Z"/></clipPath>
  </defs>
  <g id="huevo-yema">
    <path id="yema-sombra" d="M6 52C6 24 28 4 60 4C92 4 114 24 114 52C114 70 92 82 60 82C28 82 6 70 6 52Z" fill="#F39C12"/>
    <g clip-path="url(#huevo-yema-forma)">
      <path id="yema" d="M6 52C6 24 28 4 60 4C92 4 114 24 114 52C114 70 92 82 60 82C28 82 6 70 6 52Z" fill="#FFB81C" transform="translate(-7 -8)"/>
    </g>
    <ellipse id="yema-brillo" cx="42" cy="25" rx="16" ry="7.5" fill="#FFF3C4" transform="rotate(-24 42 25)"/>
    <ellipse id="yema-brillo-menor" cx="25" cy="43" rx="4.2" ry="3" fill="#FFF3C4" transform="rotate(-24 25 43)"/>
  </g>
</svg>
