<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 166" width="560" height="166" role="img" aria-labelledby="isla-pasto-title isla-pasto-desc">
  <title id="isla-pasto-title">Isla de pasto</title>
  <desc id="isla-pasto-desc">La isla del jardín: un trozo de pasto con cuerpo, el suelo del jardín de la casa en todo el taller. Sirve suelta o dentro de una tarjeta: la orilla de atrás ondulada, las esquinas redondeadas del tablero (26) y, delante, el canto del pasto más oscuro, que le da cuerpo. Una mata redonda a cada lado, matitas, flores y unas briznas de paja delante. El mismo pasto del jardín de la casa (suelo-jardin.svg). Lienzo de 560 × 166: lo que va al fondo (un edificio) se apoya en y 72; lo que va delante, entre y 120 y y 130; el centro (x 100–490) queda libre. Colores planos, luz desde arriba a la izquierda.</desc>
  <!-- Orden: canto (delante, abajo) → pasto → luz de la orilla de atrás → matitas → paja → flores → matas a los lados. -->
