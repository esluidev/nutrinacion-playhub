<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="-30 -30 300 300" role="img" aria-labelledby="avatar-zorro-title avatar-zorro-desc">
  <title id="avatar-zorro-title">Avatar · zorro</title>
  <desc id="avatar-zorro-desc">Avatar de PlayHub: la cabeza de un zorro: orejas en punta y mejillas blancas, de frente, para un círculo. El círculo y su fondo los pone quien lo coloca. Fuente maestra: avatar-zorro.svg. Colores planos, sin contorno, con la luz arriba a la izquierda; los ojos, como los de las aves de PlayHub. Las dos mitades son iguales: el eje está en x 120. El dibujo ocupa el cuadrado de 240 del centro del lienzo, con 30 de aire por cada lado.</desc>
