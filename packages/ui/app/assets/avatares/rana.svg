<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="-30 -30 300 300" role="img" aria-labelledby="avatar-rana-title avatar-rana-desc">
  <title id="avatar-rana-title">Avatar · rana</title>
  <desc id="avatar-rana-desc">Avatar de PlayHub: la cabeza de una rana: los ojos arriba y la boca ancha, de frente, para un círculo. El círculo y su fondo los pone quien lo coloca. Fuente maestra: avatar-rana.svg. Colores planos, sin contorno, con la luz arriba a la izquierda; los ojos, como los de las aves de PlayHub. Las dos mitades son iguales: el eje está en x 120. El dibujo ocupa el cuadrado de 240 del centro del lienzo, con 30 de aire por cada lado.</desc>
