  <title id="avatar-leon-title">Avatar · león</title>
  <desc id="avatar-leon-desc">Avatar de PlayHub: la cabeza de un león: la melena alrededor de la cara, de frente, para un círculo. El círculo y su fondo los pone quien lo coloca. Fuente maestra: avatar-leon.svg. Colores planos, sin contorno, con la luz arriba a la izquierda; los ojos, como los de las aves de PlayHub. Las dos mitades son iguales: el eje está en x 120. El dibujo ocupa el cuadrado de 240 del centro del lienzo, con 30 de aire por cada lado.</desc>
